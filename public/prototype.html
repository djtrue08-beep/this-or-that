<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>THIS OR THAT?! • Prototype</title>
<style>
:root{font-family:system-ui,sans-serif;color:#fff;background:#101d15}body{margin:0;background:radial-gradient(circle at top,#225d39,#101d15 75%);min-height:100vh}main{max-width:950px;margin:auto;padding:24px;text-align:center}h1{font-size:clamp(2.4rem,7vw,5rem);color:#f5c65b;margin:20px 0 0}h2{font-size:clamp(1.5rem,4vw,2.6rem)}.card{background:#172b20;border:2px solid #ba933e;border-radius:20px;padding:24px;margin:22px auto;box-shadow:0 12px 40px #0005}button,input,select{font:inherit;border-radius:12px;padding:14px;margin:6px}button{border:2px solid #e6b74d;background:#244e34;color:white;cursor:pointer;font-weight:700}button:hover{background:#36784a}button:disabled{opacity:.35;cursor:default}.gold{background:#d9a63d;color:#152217}.options{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}.option{min-width:220px;min-height:100px;font-size:1.3rem}.muted{color:#c8d5c8}.timer{border:4px solid #e6b74d;border-radius:50%;width:85px;height:85px;display:grid;place-items:center;font-size:2rem;margin:20px auto}.hide{display:none}.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.leader{display:flex;justify-content:space-between;border-bottom:1px solid #53745e;padding:12px}input,select{background:#fff;color:#152217;border:0}#notice{color:#ffd67b}small{color:#b9c8bd}</style>
<main><div class="row"><button id="full">⛶ Fullscreen</button><button id="reset">↩ Lobby</button></div><h1>THIS OR THAT?!</h1><p class="muted">CRIXUS PRESENTS • FIRST-DRAFT TEST BUILD</p><section class="card" id="screen"></section><p id="notice"></p><small>Local multiplayer simulator: add players and vote for them on this device. Phone joining and live synchronization are not enabled in this draft.</small></main>
<script>
// Isolated test build. Does not alter the main multiplayer app.
const family=[["Beach vacation","Mountain getaway"],["Pizza","Tacos"],["Super speed","Invisibility"],["Movie night","Game night"],["Dogs","Cats"],["Summer","Winter"],["Flying","Teleportation"],["Breakfast","Dinner"],["Theme park","Water park"],["Books","Movies"],["Ice cream","Cake"],["Camping","Hotel"],["Sing","Dance"],["Ocean","Pool"],["Comedy","Action"],["Pancakes","Waffles"]];
const adult=[["Fancy dinner","Weekend getaway"],["Always be early","Always be late"],["Be famous","Be wealthy"],["Texting","Phone calls"],["Go out","Stay home"],["Plan everything","Be spontaneous"],["Truth","Dare"],["Win an argument","Keep the peace"],["Luxury car","Dream house"],["Big party","Small gathering"],["Karaoke","Dance floor"],["Morning date","Late-night date"],["Cook together","Order takeout"],["Road trip","Fly"],["No social media","No streaming"],["Surprise gift","Planned gift"]];
const wild=[["Cash prize","Free vacation","New car"],["Time travel","Read minds","Teleport"],["Concert tickets","Sports tickets","Festival passes"]];
const $=s=>document.querySelector(s), el=$('#screen');let players=[],mode='family',teamSize=2,round=0,index=0,question=null,votes={},featured={},scores={},timer=null,seconds=12,phase='lobby',used=new Set();
function speak(t){$('#notice').textContent='CRIXUS: '+t;if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=1.03;u.pitch=.8;speechSynthesis.speak(u)}}
function stop(){clearInterval(timer);timer=null}
function lobby(){stop();phase='lobby';el.innerHTML='<h2>Choose your game</h2><div class="options"><button data-mode="family">👨‍👩‍👧 Family</button><button data-mode="adult">🔥 Adult</button><button data-mode="team">🤝 Team</button></div><div id="teams" class="hide"><p>Team size</p><div class="options"><button data-size="2">DUOS</button><button data-size="3">TRIOS</button><button data-size="5">5IVES</button></div></div><p id="selected"></p><input id="name" placeholder="Player name" maxlength="22"><button id="add">Add Player</button><div id="roster"></div><button id="start" class="gold">START GAME</button>';el.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;$('#teams').classList.toggle('hide',mode!=='team');renderRoster()});el.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{teamSize=+b.dataset.size;renderRoster()});$('#add').onclick=()=>{let n=$('#name').value.trim();if(n&&!players.includes(n)&&players.length<60){players.push(n);$('#name').value='';renderRoster()}};$('#start').onclick=start;renderRoster()}
function renderRoster(){let r=$('#roster');if(!r)return;$('#selected').textContent='Mode: '+mode.toUpperCase()+(mode==='team'?' • Teams of '+teamSize:'');r.textContent=players.map((p,i)=>mode==='team'?p+' (Team '+(Math.floor(i/teamSize)+1)+')':p).join(' • ')||'Add players to begin';$('#start').disabled=mode==='team'?(players.length<teamSize*2||players.length%teamSize!==0):players.length<2}
function start(){scores={};players.forEach(p=>scores[p]=0);round=0;index=0;used.clear();speak('Welcome to This or That! Choose wisely, because the crowd has opinions!');next()}
function pick(){let bank=mode==='adult'?adult:family;let choices=bank.map((q,i)=>({q,key:mode+i})).filter(x=>!used.has(x.key));if(!choices.length){used.clear();choices=bank.map((q,i)=>({q,key:mode+i}))}let item=choices[Math.floor(Math.random()*choices.length)];used.add(item.key);return {options:item.q,wild:false}}
function next(){stop();phase='vote';votes={};featured={};let final=round===3;if(mode==='team'){for(let i=0;i<players.length;i+=teamSize){let team=players.slice(i,i+teamSize);featured[i/teamSize]=team[Math.floor(Math.random()*team.length)]}}question=!final&&Math.random()<.16?{options:wild[Math.floor(Math.random()*wild.length)],wild:true}:pick();if(final)question.wild=false;let label=final?'FINAL SHOWDOWN':('ROUND '+(round+1)+' • QUESTION '+(index+1)+' OF 5');el.innerHTML='<p class="muted">'+label+'</p><h2>'+(mode==='team'?'What would the featured player choose?':'Which would you choose?')+'</h2><div id="question" class="options"></div><div class="timer" id="clock">12</div><p id="count"></p><div id="voters"></div><button id="reveal" class="gold">Reveal Early</button>';let opts=$('#question');question.options.forEach((x,i)=>{let b=document.createElement('button');b.className='option';b.textContent=(question.wild?'⭐ ':i===0?'🏹 ':'🛡️ ')+x;opts.append(b)});if(mode==='team'){let d=document.createElement('p');d.textContent='Featured: '+Object.entries(featured).map(([t,p])=>'Team '+(+t+1)+': '+p).join(' • ');el.insertBefore(d,opts)}let v=$('#voters');players.forEach(p=>{let line=document.createElement('div');line.className='row';let label=document.createElement('span');label.textContent=p+(Object.values(featured).includes(p)?' ⭐ FEATURED':'');let sel=document.createElement('select');sel.innerHTML='<option value="">Choose answer</option>'+question.options.map((x,i)=>'<option value="'+i+'">'+x+'</option>').join('');sel.onchange=()=>{if(sel.value!==''){votes[p]=+sel.value;sel.disabled=true;$('#count').textContent=Object.keys(votes).length+' / '+players.length+' answered';if(Object.keys(votes).length===players.length)reveal()}};line.append(label,sel);v.append(line)});$('#reveal').onclick=reveal;seconds=final?15:12;$('#clock').textContent=seconds;speak(question.wild?'WILD CARD! Three choices, one big decision!':final?'Final showdown! This one counts!':'Make your choice!');timer=setInterval(()=>{seconds--;let c=$('#clock');if(c)c.textContent=seconds;if(seconds<=0)reveal()},1000)}
function reveal(){if(phase!=='vote')return;stop();phase='results';let counts=question.options.map((_,i)=>Object.values(votes).filter(x=>x===i).length),max=Math.max(...counts),tied=counts.filter(x=>x===max).length>1;let base=round===3?500:question.wild?500:(round+1)*100;if(mode==='team'){for(let i=0;i<players.length;i+=teamSize){let group=players.slice(i,i+teamSize),f=featured[i/teamSize],correct=group.filter(p=>p!==f&&votes[p]!==undefined&&votes[p]===votes[f]).length;let gained=votes[f]===undefined?0:Math.round(base*correct/(teamSize-1));group.forEach(p=>scores[p]+=gained)}}else{players.forEach(p=>{if(votes[p]===undefined)return;scores[p]+=tied?Math.round(base/4):counts[votes[p]]===max?base:Math.round(base/2)})}el.innerHTML='<h2>THE RESULTS</h2>'+(mode==='team'?'<p>Featured picks: '+Object.entries(featured).map(([t,p])=>'Team '+(+t+1)+': '+p+' chose '+(votes[p]===undefined?'no answer':question.options[votes[p]])).join(' • ')+'</p>':'')+question.options.map((o,i)=>'<div class="leader"><span>'+o+'</span><strong>'+counts[i]+' votes • '+(Object.keys(votes).length?Math.round(counts[i]*100/Object.keys(votes).length):0)+'%</strong></div>').join('')+'<h3>'+(mode==='team'?'Team chemistry scores updated!':tied?'It is a tie!':'The majority has spoken!')+'</h3><button id="continue" class="gold">Continue</button>';speak(mode==='team'?'Some teams know each other better than others!':tied?'A tie! Nobody wanted to make this easy!':'The people have spoken!');$('#continue').onclick=()=>{if(round===3)return board();index++;if(index>=5){round++;index=0;board()}else next()}}
function board(){phase='board';let entries=mode==='team'?Array.from({length:players.length/teamSize},(_,i)=>({name:'Team '+(i+1),score:scores[players[i*teamSize]]})):players.map(p=>({name:p,score:scores[p]}));entries.sort((a,b)=>b.score-a.score);let previous=null,rank=0;entries=entries.map((e,i)=>{if(e.score!==previous)rank=i+1;previous=e.score;return {...e,rank}});el.innerHTML='<h2>'+(round===3?'FINAL SHOWDOWN NEXT':'ROUND '+round+' LEADERBOARD')+'</h2>'+entries.slice(0,5).map((x,i)=>'<div class="leader"><span>'+(['🥇','🥈','🥉'][x.rank-1]||'')+' '+x.name+'</span><strong>'+x.score+'</strong></div>').join('')+'<button id="continue" class="gold">Continue</button>';$('#continue').onclick=()=>round===3?finish():next();speak('Check those scores! The competition is heating up!')}
function finish(){phase='finish';let entries=mode==='team'?Array.from({length:players.length/teamSize},(_,i)=>({name:'Team '+(i+1),score:scores[players[i*teamSize]]})):players.map(p=>({name:p,score:scores[p]}));entries.sort((a,b)=>b.score-a.score);let winners=entries.filter(e=>e.score===entries[0].score).map(e=>e.name);el.innerHTML='<h2>🏆 CHAMPIONS 🏆</h2><h2>'+winners.join(' & ')+'</h2>'+entries.map(e=>'<div class="leader"><span>'+e.name+'</span><strong>'+e.score+'</strong></div>').join('')+'<button id="again" class="gold">Play Again</button><button id="back">Return to Lobby</button>';$('#again').onclick=start;$('#back').onclick=lobby;speak('We have our winners! Give it up for '+winners.length+' champion'+(winners.length>1?'s':'')+'!')}
$('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();$('#reset').onclick=lobby;lobby();
</script></html>
