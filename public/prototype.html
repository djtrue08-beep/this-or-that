<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>THIS OR THAT?! • Prototype</title>
<style>
:root{font-family:system-ui,sans-serif;color:#fff;background:#101d15}body{margin:0;background:radial-gradient(circle at top,#225d39,#101d15 75%);min-height:100vh}main{max-width:950px;margin:auto;padding:24px;text-align:center}h1{font-size:clamp(2.4rem,7vw,5rem);color:#f5c65b;margin:20px 0 0}h2{font-size:clamp(1.5rem,4vw,2.6rem)}.card{background:#172b20;border:2px solid #ba933e;border-radius:20px;padding:24px;margin:22px auto;box-shadow:0 12px 40px #0005}button,input,select{font:inherit;border-radius:12px;padding:14px;margin:6px}button{border:2px solid #e6b74d;background:#244e34;color:white;cursor:pointer;font-weight:700}button:hover{background:#36784a}button:disabled{opacity:.35;cursor:default}.gold{background:#d9a63d;color:#152217}.options{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}.option{min-width:220px;min-height:100px;font-size:1.3rem}.muted{color:#c8d5c8}.timer{border:4px solid #e6b74d;border-radius:50%;width:85px;height:85px;display:grid;place-items:center;font-size:2rem;margin:20px auto}.hide{display:none}.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.leader{display:flex;justify-content:space-between;border-bottom:1px solid #53745e;padding:12px}input,select{background:#fff;color:#152217;border:0}#notice{color:#ffd67b}small{color:#b9c8bd}.pill{display:inline-block;padding:8px;margin:5px;background:#305c3b;border-radius:18px}.goldtext{color:#ffd16d;font-weight:bold}#voters{max-height:350px;overflow:auto}#voters .row{padding:6px;border-bottom:1px solid #39513e}</style>
<main><div class="row"><button id="full">⛶ Fullscreen</button><button id="reset">↩ Lobby</button></div><h1>THIS OR THAT?!</h1><p class="muted">CRIXUS PRESENTS • FIRST-DRAFT TEST BUILD</p><section class="card" id="screen"></section><p id="notice"></p><small>TEST BUILD: local simulated players only. Real QR joining and phone synchronization require a dedicated secure multiplayer backend.</small></main>
<script>
const family=[["Beach vacation","Mountain getaway"],["Pizza","Tacos"],["Super speed","Invisibility"],["Movie night","Game night"],["Dogs","Cats"],["Summer","Winter"],["Flying","Teleportation"],["Breakfast","Dinner"],["Theme park","Water park"],["Books","Movies"],["Ice cream","Cake"],["Camping","Hotel"],["Sing","Dance"],["Ocean","Pool"],["Comedy","Action"],["Pancakes","Waffles"],["Sunrise","Sunset"],["Road trip","Flight"],["Board games","Video games"]];
const adult=[["Fancy dinner","Weekend getaway"],["Always be early","Always be late"],["Be famous","Be wealthy"],["Texting","Phone calls"],["Go out","Stay home"],["Plan everything","Be spontaneous"],["Truth","Dare"],["Win an argument","Keep the peace"],["Luxury car","Dream house"],["Big party","Small gathering"],["Karaoke","Dance floor"],["Morning date","Late-night date"],["Cook together","Order takeout"],["Road trip","Fly"],["No social media","No streaming"],["Surprise gift","Planned gift"],["Staycation","Cruise"],["Concert","Comedy show"],["Beach house","Cabin"]];
const wild=[["Cash prize","Free vacation","New car"],["Time travel","Read minds","Teleport"],["Concert tickets","Sports tickets","Festival passes"]];
const $=s=>document.querySelector(s),el=$('#screen');
let players=[],teams=[],mode='family',teamSize=2,round=0,index=0,question=null,votes={},featured={},scores={},streak={},chemistry={},timer=null,seconds=12,phase='setup',used=new Set(),paused=false,remaining=0,locked=false;
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lines={intro:["Welcome to This or That! Let the choices begin!","Crixus is in the building. Let's see what you know!"],round:["New round, new decisions. Let's go!","Keep those points coming. Next round!"],result:["The votes are in!","Now that's an interesting split!","Somebody knows their teammates!"],board:["Let's see who's leading this thing!","Check the standings. The game isn't over!"],wild:["Wild card! Three choices, one big moment!"],final:["Final showdown! This one counts!"]};
let lastLine='';
function speak(type){const list=lines[type]||lines.result;let choices=list.filter(x=>x!==lastLine);let t=choices[Math.floor(Math.random()*choices.length)]||list[0];lastLine=t;$('#notice').textContent='CRIXUS: '+t;if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=1.03;u.pitch=.8;speechSynthesis.speak(u)}}
function stop(){clearInterval(timer);timer=null}
function schedule(fn,ms){stop();timer=setTimeout(()=>{if(!paused)fn();else{remaining=ms;locked=fn}},ms)}
function countdown(sec,fn){stop();seconds=sec;const clock=$('#clock');if(clock)clock.textContent=seconds;timer=setInterval(()=>{if(paused)return;seconds--;if($('#clock'))$('#clock').textContent=seconds;if(seconds<=0){stop();fn()}},1000)}
function home(){stop();paused=false;phase='setup';el.innerHTML='<h2>Choose your game</h2><div class="options"><button data-mode="family">👨‍👩‍👧 Family</button><button data-mode="adult">🔥 Adult</button><button data-mode="team">🤝 Team</button></div><div id="teams" class="hide"><p>Choose team size</p><div class="options"><button data-size="2">DUOS</button><button data-size="3">TRIOS</button><button data-size="5">5IVES</button></div></div><p id="selected"></p><button id="go" class="gold">CONTINUE</button>';el.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;$('#teams').classList.toggle('hide',mode!=='team');drawSelection()});el.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{teamSize=+b.dataset.size;drawSelection()});$('#go').onclick=lobby;drawSelection()}
function drawSelection(){$('#selected').textContent='Selected: '+mode.toUpperCase()+(mode==='team'?' • '+({2:'DUOS',3:'TRIOS',5:'5IVES'}[teamSize]):'')}
function lobby(){stop();phase='lobby';let team=mode==='team';el.innerHTML='<h2>'+(team?'Team Lobby':'Player Lobby')+'</h2><p class="muted">'+(team?'Players create or join their own teams. Full teams lock automatically.':'Add players to simulate phone connections.')+'</p><input id="name" placeholder="Player name" maxlength="22"><button id="add">Add Player</button><div id="roster"></div><div id="teamtools"></div><div class="options"><button id="back">← BACK</button><button id="start" class="gold">START GAME</button></div>';$('#back').onclick=home;$('#add').onclick=()=>{let n=$('#name').value.trim();if(n&&!players.includes(n)&&players.length<60){players.push(n);$('#name').value='';drawLobby()}};$('#start').onclick=start;drawLobby()}
function drawLobby(){if(phase!=='lobby')return;let r=$('#roster');r.innerHTML=players.map(p=>'<span class="pill">'+safe(p)+'</span>').join(' ')||'<p>No players yet.</p>';let t=$('#teamtools');if(mode==='team'){t.innerHTML='<h3>Available Teams</h3><div id="teamlist"></div><input id="teamname" placeholder="Create team name" maxlength="26"><select id="captain"><option value="">Select player to create team</option>'+players.filter(p=>!teams.some(t=>t.members.includes(p))).map(p=>'<option>'+safe(p)+'</option>').join('')+'</select><button id="createTeam">Create Team</button><p class="muted">Select an unassigned player below to join or switch teams.</p><select id="who"><option value="">Choose player</option>'+players.map(p=>'<option>'+safe(p)+'</option>').join('')+'</select><select id="which"><option value="">Choose team</option>'+teams.filter(t=>t.members.length<teamSize).map(t=>'<option value="'+safe(t.name)+'">'+safe(t.name)+'</option>').join('')+'</select><button id="joinTeam">Join / Switch</button><button id="leaveTeam">Leave Team</button>';$('#teamlist').innerHTML=teams.map(t=>'<div class="leader"><span>'+safe(t.name)+' ('+t.members.length+'/'+teamSize+')'+(t.members.length===teamSize?' 🔒':'')+'</span><span>'+t.members.map(safe).join(', ')+'</span></div>').join('')||'<p>No teams created yet.</p>';$('#createTeam').onclick=()=>{let n=$('#teamname').value.trim(),p=$('#captain').value;if(!n||!p||teams.some(t=>t.name.toLowerCase()===n.toLowerCase()))return;teams.push({name:n,members:[p]});drawLobby()};$('#joinTeam').onclick=()=>{let p=$('#who').value,n=$('#which').value,t=teams.find(t=>t.name===n);if(!p||!t||t.members.length>=teamSize)return;teams.forEach(x=>x.members=x.members.filter(v=>v!==p));t.members.push(p);drawLobby()};$('#leaveTeam').onclick=()=>{let p=$('#who').value;teams.forEach(t=>t.members=t.members.filter(v=>v!==p));teams=teams.filter(t=>t.members.length);drawLobby()}}else t.innerHTML='';let valid=mode==='team'?teams.filter(t=>t.members.length===teamSize).length>=2&&players.every(p=>teams.some(t=>t.members.includes(p))):players.length>=2;$('#start').disabled=!valid}
function start(){if($('#start')?.disabled)return;scores={};streak={};chemistry={};(mode==='team'?teams.map(t=>t.name):players).forEach(p=>{scores[p]=0;streak[p]=0;chemistry[p]={correct:0,total:0}});round=0;index=0;used.clear();paused=false;transition('intro')}
function transition(kind){stop();phase=kind;let labels={intro:'WELCOME TO THIS OR THAT?!',round:'ROUND '+(round+1),board:'LEADERBOARD',final:'FINAL SHOWDOWN'};el.innerHTML='<h2>'+labels[kind]+'</h2><p class="muted">CRIXUS PRESENTS</p><div class="timer" id="clock"></div>';speak(kind==='intro'?'intro':kind==='round'?'round':kind==='final'?'final':'board');countdown(kind==='intro'?5:kind==='round'?4:4,()=>kind==='intro'?transition('round'):kind==='board'?round===3?finish():round===2?transition('final'):transition('round'):next())}
function pick(){let bank=mode==='adult'?adult:family;let choices=bank.map((q,i)=>({q,key:mode+i})).filter(x=>!used.has(x.key));if(!choices.length){used.clear();choices=bank.map((q,i)=>({q,key:mode+i}))}let item=choices[Math.floor(Math.random()*choices.length)];used.add(item.key);return {options:item.q,wild:false}}
function next(){stop();phase='vote';votes={};featured={};let final=round===3;if(mode==='team')teams.forEach(t=>featured[t.name]=t.members[Math.floor(Math.random()*t.members.length)]);question=!final&&Math.random()<.18?{options:wild[Math.floor(Math.random()*wild.length)],wild:true}:pick();if(final)question.wild=false;let label=final?'FINAL SHOWDOWN':('ROUND '+(round+1)+' • QUESTION '+(index+1)+' OF 5');el.innerHTML='<p class="muted">'+label+'</p><h2>'+(mode==='team'?'What would the featured player choose?':'Which would you choose?')+'</h2><div id="question" class="options"></div><div class="timer" id="clock">12</div><p id="count"></p><div id="voters"></div>';let opts=$('#question');question.options.forEach((x,i)=>{let b=document.createElement('button');b.className='option';b.textContent=(question.wild?'⭐ ':i===0?'🏹 ':'🛡️ ')+x;opts.append(b)});if(mode==='team'){let d=document.createElement('p');d.textContent='Featured: '+Object.entries(featured).map(([t,p])=>t+': '+p).join(' • ');el.insertBefore(d,opts)}let v=$('#voters');players.forEach(p=>{let line=document.createElement('div');line.className='row';let label=document.createElement('span');label.textContent=p+(Object.values(featured).includes(p)?' ⭐ FEATURED':'');let sel=document.createElement('select');sel.innerHTML='<option value="">Choose answer</option>'+question.options.map((x,i)=>'<option value="'+i+'">'+safe(x)+'</option>').join('');sel.onchange=()=>{if(sel.value!==''){votes[p]=+sel.value;sel.disabled=true;$('#count').textContent=Object.keys(votes).length+' / '+players.length+' answered';if(Object.keys(votes).length===players.length)reveal()}};line.append(label,sel);v.append(line)});speak(question.wild?'wild':final?'final':'round');countdown(final?15:12,reveal)}
function reveal(){if(phase!=='vote')return;stop();phase='results';let counts=question.options.map((_,i)=>Object.values(votes).filter(x=>x===i).length),max=Math.max(...counts),tied=counts.filter(x=>x===max).length>1;let base=round===3?500:question.wild?500:(round+1)*100;let bonuses=[];
if(mode==='team'){teams.forEach(t=>{let f=featured[t.name],guessers=t.members.filter(p=>p!==f),correct=guessers.filter(p=>votes[p]!==undefined&&votes[f]!==undefined&&votes[p]===votes[f]).length;chemistry[t.name].correct+=correct;chemistry[t.name].total+=guessers.length;let points=Math.round(base*correct/guessers.length);scores[t.name]+=points;if(teamSize===2){streak[t.name]=correct?streak[t.name]+1:0;if(streak[t.name]===3){scores[t.name]+=75;bonuses.push(t.name+': +75 STREAK BONUS');streak[t.name]=0}else if(streak[t.name]>0)bonuses.push(t.name+': '+(3-streak[t.name])+' more correct to earn +75')}else{if(correct===guessers.length){scores[t.name]+=50;bonuses.push(t.name+': +50 PERFECT MATCH')}else if(correct>=Math.ceil(guessers.length/2)){scores[t.name]+=25;bonuses.push(t.name+': +25 MAJORITY MATCH')}}})}
else players.forEach(p=>{if(votes[p]===undefined)return;scores[p]+=tied?Math.round(base/4):counts[votes[p]]===max?base:Math.round(base/2)});
el.innerHTML='<h2>THE RESULTS</h2>'+(mode==='team'?'<p>Featured choices: '+Object.entries(featured).map(([t,p])=>safe(t)+': '+safe(p)+' chose '+(votes[p]===undefined?'no answer':safe(question.options[votes[p]]))).join(' • ')+'</p>':'')+question.options.map((o,i)=>'<div class="leader"><span>'+safe(o)+'</span><strong>'+counts[i]+' votes • '+(Object.keys(votes).length?Math.round(counts[i]*100/Object.keys(votes).length):0)+'%</strong></div>').join('')+bonuses.map(x=>'<p class="goldtext">'+safe(x)+'</p>').join('')+'<div class="timer" id="clock">8</div>';speak('result');countdown(8,()=>{if(round===3){round=4;board();return}index++;if(index>=5){round++;index=0;board()}else next()})}
function board(){stop();phase='board';let entries=Object.entries(scores).map(([name,score])=>({name,score})).sort((a,b)=>b.score-a.score);let prev=null,rank=0;entries=entries.map((e,i)=>{if(e.score!==prev)rank=i+1;prev=e.score;return {...e,rank}});el.innerHTML='<h2>'+(round===4?'FINAL LEADERBOARD':'ROUND '+round+' LEADERBOARD')+'</h2>'+entries.slice(0,round===4?12:5).map(e=>'<div class="leader"><span>'+(['🥇','🥈','🥉'][e.rank-1]||'')+' '+safe(e.name)+'</span><strong>'+e.score+(mode==='team'?' • '+Math.round(100*chemistry[e.name].correct/Math.max(1,chemistry[e.name].total))+'% chemistry':'')+'</strong></div>').join('')+'<div class="timer" id="clock">6</div>';speak('board');countdown(6,()=>round===4?finish():round===3?transition('final'):transition('round'))}
function finish(){stop();phase='finish';let entries=Object.entries(scores).sort((a,b)=>b[1]-a[1]),winners=entries.filter(e=>e[1]===entries[0][1]).map(e=>e[0]);el.innerHTML='<h2>🏆 CHAMPIONS 🏆</h2><h2>'+winners.map(safe).join(' & ')+'</h2>'+entries.map(e=>'<div class="leader"><span>'+safe(e[0])+'</span><strong>'+e[1]+'</strong></div>').join('')+'<button id="again" class="gold">Play Again</button><button id="back">Return to Lobby</button>';$('#again').onclick=start;$('#back').onclick=lobby;speak('result')}
$('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
$('#reset').textContent='⚙ Options / Pause';$('#reset').onclick=()=>{if(phase==='lobby'||phase==='setup'){home();return}paused=!paused;$('#reset').textContent=paused?'▶ Resume':'⚙ Options / Pause';if(paused){$('#notice').textContent='PAUSED • Press Resume to continue';window.speechSynthesis?.cancel?.()}};
home();</script></html>
